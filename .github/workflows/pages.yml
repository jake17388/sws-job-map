name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-actions-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `check` builds backend + frontend, syntax-checks, and runs the test
      # suite. A failure here stops the deploy before it reaches the live site.
      - name: Verify and build
        run: npm run check

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed frontend
        run: |
          curl --fail --location --silent --show-error --retry 4 --retry-delay 3 \
            "${{ steps.deployment.outputs.page_url }}" | grep -q "SWS Job Map"
