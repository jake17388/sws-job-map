name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-actions-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `check` builds backend + frontend, syntax-checks, and runs the test
      # suite. A failure here stops the deploy before it reaches the live site.
      - name: Verify and build
        run: npm run check

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Wait for Pages artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The upload can complete before the Actions API lists the artifact.
          deadline=$((SECONDS + 60))
          while (( SECONDS < deadline )); do
            if count=$(timeout 5s gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length'); then
              case "$count" in
                1) exit 0 ;;
                0) ;;
                *)
                  echo "::error::Multiple github-pages artifacts found. Start a fresh workflow run."
                  exit 1
                  ;;
              esac
            fi
            sleep 3
          done
          echo "::error::The github-pages artifact did not become visible within 60 seconds."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed frontend
        run: |
          curl --fail --location --silent --show-error --retry 4 --retry-delay 3 \
            "${{ steps.deployment.outputs.page_url }}" | grep -q "SWS Job Map"
