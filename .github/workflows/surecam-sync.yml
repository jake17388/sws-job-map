name: Sync SureCam Session

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: surecam-sync
        run: npm install

      - name: Install Playwright browser
        working-directory: surecam-sync
        run: npx playwright install --with-deps chromium

      - name: Run sync
        working-directory: surecam-sync
        env:
          SURECAM_EMAIL: ${{ secrets.SURECAM_EMAIL }}
          SURECAM_PASSWORD: ${{ secrets.SURECAM_PASSWORD }}
          SWS_EXTENSION_SECRET: ${{ secrets.SWS_EXTENSION_SECRET }}
        run: node sync.mjs
