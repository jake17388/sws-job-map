name: Sync SureCam Session

on:
  schedule:
    # Refresh frequently enough for the map to show live truck positions.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

concurrency:
  group: surecam-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: surecam-sync
        run: npm install

      - name: Install Playwright browser
        working-directory: surecam-sync
        run: npx playwright install --with-deps chromium

      - name: Run sync
        working-directory: surecam-sync
        env:
          SURECAM_EMAIL: ${{ secrets.SURECAM_EMAIL }}
          SURECAM_PASSWORD: ${{ secrets.SURECAM_PASSWORD }}
          SWS_EXTENSION_SECRET: ${{ secrets.SWS_EXTENSION_SECRET }}
        run: node sync.mjs

      # The login flow is the fragile part; a screenshot of where it stopped
      # usually identifies the cause without another debug round-trip.
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshot
          path: surecam-sync/failure.png
          if-no-files-found: ignore
